<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FOM Studios | Client Portal</title>
<link rel="icon" type="image/png" href="assets/mascot-head-color.png">
<link rel="apple-touch-icon" href="assets/mascot-head-color.png">
<style>
:root{
    --bg:#f1f0ec; --bg-pill:#fafaf9; --bg-dark:#2a2b2c; --ink:#2a2b2c; --ink-soft:#6f6f6d;
    --ink-on-dark:#f1f0ec; --line:#dcdad3; --accent:#02367B; --accent-hover:#022a5f;
    --accent-on-dark:#5B9AE0; --container:900px; --gutter:clamp(18px,5vw,48px);
    --radius-pill:999px; --radius-card:20px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh;}
img{display:block;max-width:100%;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
.wrap{max-width:var(--container);margin:0 auto;padding:0 var(--gutter);}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:10px;}

/* ============================================================
   LOGIN GATE — shown until Firebase Auth confirms the user
   ============================================================ */
.login-gate{
    position:fixed;inset:0;background:var(--bg);z-index:3000;
    display:flex;align-items:center;justify-content:center;padding:20px;
}
.login-card{
    background:var(--bg-pill);border:1px solid var(--line);border-radius:var(--radius-card);
    padding:40px 36px;max-width:400px;width:100%;text-align:center;
    box-shadow:0 24px 60px rgba(0,0,0,.12);
}
.login-card .mascot{width:80px;margin:0 auto 18px;}
.login-card .mascot img{width:100%;border-radius:50%;}
.login-card .brand{font-weight:800;font-size:20px;letter-spacing:.02em;margin-bottom:4px;}
.login-card .brand-sub{color:var(--ink-soft);font-size:14px;margin-bottom:28px;}
.login-card input{
    width:100%;border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;font-size:15px;font-family:inherit;margin-bottom:12px;
    background:#fff;color:var(--ink);
}
.login-card input:focus{outline:2px solid var(--accent);outline-offset:1px;}
.login-card .btn{
    width:100%;background:var(--accent);color:var(--ink-on-dark);border:none;
    border-radius:var(--radius-pill);padding:14px;font-size:15px;font-weight:700;
    cursor:pointer;transition:.2s;margin-top:4px;
}
.login-card .btn:hover{background:var(--accent-hover);}
.login-card .lg-err{color:#c0392b;font-size:13px;margin-top:10px;min-height:18px;}
.login-card .reset-link{margin-top:14px;font-size:13px;color:var(--accent);cursor:pointer;font-weight:600;}
.login-card .reset-link:hover{text-decoration:underline;}

/* ============================================================
   NAV (minimal — just brand + logout)
   ============================================================ */
.nav-shell{
    position:sticky;top:0;z-index:1000;padding:16px var(--gutter) 0;
    pointer-events:none;
}
nav.pill{
    pointer-events:auto;max-width:var(--container);margin:0 auto;
    background:var(--bg-pill);border:1px solid var(--line);border-radius:var(--radius-pill);
    padding:13px 20px;display:flex;align-items:center;justify-content:space-between;
    box-shadow:0 1px 2px rgba(0,0,0,.03);
}
.brand-mark{font-weight:800;font-size:17px;letter-spacing:.02em;}
.btn-ghost{
    background:transparent;border:1px solid var(--line);border-radius:var(--radius-pill);
    padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);
    transition:.2s;
}
.btn-ghost:hover{border-color:var(--ink);color:var(--ink);}

/* ============================================================
   PAGE
   ============================================================ */
.page{padding:32px 0 80px;}

/* greeting */
.greeting{margin-bottom:32px;}
.greeting h1{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.01em;}
.greeting p{color:var(--ink-soft);margin-top:6px;font-size:15px;}

/* empty state */
.empty-state{
    background:var(--bg-pill);border:1px solid var(--line);border-radius:var(--radius-card);
    padding:56px 32px;text-align:center;
}
.empty-state h3{font-size:20px;font-weight:800;margin-bottom:8px;}
.empty-state p{color:var(--ink-soft);max-width:36ch;margin:0 auto;}

/* ============================================================
   BOOKING CARD — each project the client has booked
   ============================================================ */
.booking-list{display:flex;flex-direction:column;gap:20px;}

.booking-card{
    background:var(--bg-pill);border:1px solid var(--line);
    border-radius:var(--radius-card);overflow:hidden;
}

/* header row (always visible) */
.booking-header{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:20px 24px;flex-wrap:wrap;cursor:pointer;
    user-select:none;
}
.booking-header:hover{background:#f5f4f0;}
.booking-id{
    font-size:12px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin-bottom:4px;
}
.booking-title{font-size:18px;font-weight:800;letter-spacing:-.01em;}
.booking-date{font-size:14px;color:var(--ink-soft);margin-top:2px;}
.booking-meta{display:flex;align-items:center;gap:12px;flex-shrink:0;}
.status-pill{
    font-size:12px;font-weight:700;border-radius:var(--radius-pill);
    padding:6px 14px;color:#fff;white-space:nowrap;
}
.chevron{color:var(--ink-soft);font-size:14px;transition:transform .3s;flex-shrink:0;}
.booking-card.open .chevron{transform:rotate(180deg);}

/* expand body */
.booking-body{
    display:grid;grid-template-rows:0fr;
    transition:grid-template-rows .35s ease;
}
.booking-card.open .booking-body{grid-template-rows:1fr;}
.booking-body-inner{overflow:hidden;min-height:0;}

.booking-body-inner > .inner-pad{
    padding:0 24px 28px;
    border-top:1px solid var(--line);
}

/* detail grid */
.detail-grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:16px;padding:22px 0;
}
.detail-item .d-label{
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--ink-soft);font-weight:600;margin-bottom:5px;
}
.detail-item .d-val{font-size:15px;font-weight:600;color:var(--ink);}

/* message from FOM */
.fom-message{
    background:var(--bg);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;margin-bottom:20px;font-size:14px;color:var(--ink-soft);
    line-height:1.7;
}
.fom-message strong{color:var(--ink);display:block;margin-bottom:4px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;}

/* deliverables status */
.deliverables-section{margin-bottom:20px;}
.deliverables-section h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--ink-soft);margin-bottom:12px;}

.status-timeline{
    display:flex;align-items:stretch;gap:0;
    border:1px solid var(--line);border-radius:var(--radius-pill);overflow:hidden;
    background:var(--bg);
}
.timeline-step{
    flex:1;text-align:center;padding:10px 4px;font-size:11px;font-weight:600;
    color:var(--ink-soft);position:relative;
    border-right:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    line-height:1.2;white-space:nowrap;
}
.timeline-step:last-child{border-right:none;}
.timeline-step.done{background:var(--accent);color:#fff;}
.timeline-step.active{background:#e7f0ff;color:var(--accent);}

/* document links */
.doc-links{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.doc-btn{
    display:inline-flex;align-items:center;gap:8px;
    border:1px solid var(--line);border-radius:var(--radius-pill);
    padding:10px 18px;font-size:13px;font-weight:600;color:var(--ink);
    background:var(--bg-pill);transition:.2s;
}
.doc-btn:hover{border-color:var(--ink);background:var(--ink);color:var(--bg-pill);}
.doc-btn svg{width:16px;height:16px;flex-shrink:0;}

/* deliverables download CTA */
.download-cta{
    background:var(--bg-dark);border-radius:14px;padding:20px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
}
.download-cta .dc-text{color:var(--ink-on-dark);}
.download-cta .dc-text strong{display:block;font-size:16px;font-weight:800;margin-bottom:3px;}
.download-cta .dc-text span{font-size:13px;color:#b9b8b5;}
.download-cta a.dl-btn{
    display:inline-flex;align-items:center;gap:8px;
    background:var(--accent);color:#fff;border-radius:var(--radius-pill);
    padding:12px 22px;font-size:14px;font-weight:700;transition:.2s;white-space:nowrap;
}
.download-cta a.dl-btn:hover{background:var(--accent-hover);}

.not-ready{
    background:#f5f4f0;border:1px solid var(--line);border-radius:14px;
    padding:18px 20px;font-size:14px;color:var(--ink-soft);
}

/* ============================================================
   FOOTER
   ============================================================ */
.portal-footer{
    text-align:center;padding:32px var(--gutter);
    font-size:12px;color:var(--ink-soft);border-top:1px solid var(--line);
}
.portal-footer a{color:var(--accent);font-weight:600;}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media(max-width:640px){
    .detail-grid{grid-template-columns:1fr 1fr;}
    .booking-header{padding:16px 18px;}
    .booking-body-inner > .inner-pad{padding:0 18px 22px;}
    .download-cta{flex-direction:column;align-items:flex-start;}
}
@media(max-width:400px){
    .detail-grid{grid-template-columns:1fr;}
    .timeline-step{font-size:10px;padding:8px 2px;}
}
</style>
</head>
<body>

<!-- ============================================================
     LOGIN GATE
     ============================================================ -->
<div class="login-gate" id="loginGate">
    <div class="login-card">
        <div class="mascot">
            <img src="assets/mascot-head-color.png" alt="FOM Studios" onerror="this.style.display='none'">
        </div>
        <div class="brand">FOM STUDIOS</div>
        <div class="brand-sub">Client Portal — sign in to view your project</div>
        <input type="email" id="lgEmail" placeholder="Email address" autocomplete="username">
        <input type="password" id="lgPass" placeholder="Password" autocomplete="current-password">
        <button class="btn" id="lgBtn">Sign in</button>
        <p class="lg-err" id="lgErr"></p>
        <div class="reset-link" id="resetLink">Forgot password?</div>
    </div>
</div>

<!-- ============================================================
     MAIN (hidden until signed in)
     ============================================================ -->
<div id="mainApp" style="display:none;">

    <div class="nav-shell">
        <nav class="pill">
            <a href="/" class="brand-mark">FOM STUDIOS</a>
            <button class="btn-ghost" id="logoutBtn">Sign out</button>
        </nav>
    </div>

    <div class="page">
        <div class="wrap">
            <div class="greeting">
                <span class="eyebrow">Client Portal</span>
                <h1 id="greetingName">Welcome back</h1>
                <p id="greetingSub">Here are your FOM Studios bookings and deliverables.</p>
            </div>
            <div id="bookingList" class="booking-list"></div>
        </div>
    </div>

    <footer class="portal-footer">
        <p>Questions? Contact us at <a href="mailto:fomxstudios@gmail.com">fomxstudios@gmail.com</a> or <a href="https://wa.me/27737553136">WhatsApp</a></p>
    </footer>
</div>
<script>
/* Firebase config embedded directly so the portal works on the public site
   without needing firebase-config.js as a sibling file */
var firebaseConfig = {
  apiKey:            "AIzaSyCbRXQmIxzVWuFS0CRmDY33qYuzpcVL80A",
  authDomain:        "fom-studios.firebaseapp.com",
  projectId:         "fom-studios",
  storageBucket:     "fom-studios.firebasestorage.app",
  messagingSenderId: "1049126528829",
  appId:             "1:1049126528829:web:8ed0ea930e0b1579630754"
};
</script>
<script type="module">
import { initializeApp, getApp }                                    from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail,
         onAuthStateChanged, signOut }                               from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, onSnapshot }                      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';


/* ============================================================
   STATUS CONFIG — colours + progress steps
   A client's status maps to a step number (0-based) in the
   pipeline, coloured accordingly.
   ============================================================ */
const STATUS_CFG = {
    'Pending':   { color:'#6f6f6d', step:0 },
    'Editing':   { color:'#02367B', step:2 },
    'Completed': { color:'#2a2b2c', step:3 },
    'Delivered': { color:'#27ae60', step:4 },
    'Cancelled': { color:'#c0392b', step:-1 },
};
const PIPELINE = ['Booked','Shoot Day','Editing','Finalising','Delivered'];

const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
const RZA = n => 'R' + (Math.round((+n||0)*100)/100).toLocaleString('en-ZA',{minimumFractionDigits:2});
const fmtDate = d => { if(!d) return '—'; try{ const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('en-ZA',{weekday:'short',day:'numeric',month:'long',year:'numeric'}); }catch(e){return d;} };

/* ============================================================
   RENDER — build booking cards from Firestore orders that
   belong to the currently signed-in client email.
   ============================================================ */
function renderOrders(orders, userEmail){
    const list = $('bookingList');
    // filter to this client's orders (match by clientEmail field, case-insensitive)
    const mine = orders.filter(o => (o.clientEmail||'').toLowerCase() === userEmail.toLowerCase());

    if(!mine.length){
        list.innerHTML = `<div class="empty-state">
            <h3>No bookings yet</h3>
            <p>Once FOM Studios adds your booking, it will appear here. Get in touch if you think something's missing.</p>
        </div>`;
        return;
    }

    list.innerHTML = mine.map(o => buildCard(o)).join('');

    // attach toggle listeners
    list.querySelectorAll('.booking-header').forEach(hdr => {
        hdr.addEventListener('click', () => {
            const card = hdr.closest('.booking-card');
            card.classList.toggle('open');
            hdr.querySelector('.chevron').setAttribute('aria-expanded', card.classList.contains('open'));
        });
    });
}

function buildCard(o){
    const cfg = STATUS_CFG[o.status] || STATUS_CFG['Pending'];
    const step = cfg.step;

    // timeline steps
    const timeline = (o.status === 'Cancelled')
        ? `<div class="not-ready" style="background:#fff4f4;border-color:#f0c0c0;color:#a33;">This booking was cancelled. Please contact FOM Studios for more information.</div>`
        : `<div class="status-timeline">${PIPELINE.map((s,i) =>
            `<div class="timeline-step ${i<step?'done':i===step?'active':''}">${esc(s)}</div>`
          ).join('')}</div>`;

    // document buttons
    const contractBtn = o.contractUrl
        ? `<a class="doc-btn" href="${esc(o.contractUrl)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Contract</a>` : '';

    const invoiceBtn = o.invoiceUrl
        ? `<a class="doc-btn" href="${esc(o.invoiceUrl)}" target="_blank" rel="noopener">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            Invoice</a>` : '';

    const hasDocs = contractBtn || invoiceBtn;

    // deliverables section
    const deliverables = (o.deliverablesReady && o.deliverablesUrl)
        ? `<div class="download-cta">
            <div class="dc-text">
                <strong>Your files are ready 🎉</strong>
                <span>High-resolution photos &amp; videos — download at your convenience.</span>
            </div>
            <a class="dl-btn" href="${esc(o.deliverablesUrl)}" target="_blank" rel="noopener">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download files
            </a>
          </div>`
        : `<div class="not-ready">
            <strong style="display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;">Files not ready yet</strong>
            Your edited photos${o.product&&o.product.toLowerCase().includes('video')||o.product&&o.product.toLowerCase().includes('reel')?'/videos':''} are being worked on — you'll receive an email when they're ready to download.
          </div>`;

    // message from FOM
    const message = o.portalMessage
        ? `<div class="fom-message"><strong>Message from FOM Studios</strong>${esc(o.portalMessage)}</div>` : '';

    // outstanding balance (only show if > 0)
    const outstanding = (+o.total||0) - (+o.paid||0);
    const outstandingHtml = outstanding > 0
        ? `<div class="detail-item"><div class="d-label">Outstanding</div><div class="d-val" style="color:#c0392b;">${RZA(outstanding)}</div></div>` : '';

    return `
    <div class="booking-card">
        <div class="booking-header">
            <div>
                <div class="booking-id">${esc(o.orderId||'—')}</div>
                <div class="booking-title">${esc(o.product||'Booking')}</div>
                <div class="booking-date">${fmtDate(o.shootDate)}</div>
            </div>
            <div class="booking-meta">
                <span class="status-pill" style="background:${cfg.color};">${esc(o.status||'Pending')}</span>
                <span class="chevron" aria-expanded="false">▾</span>
            </div>
        </div>
        <div class="booking-body">
            <div class="booking-body-inner">
                <div class="inner-pad">
                    ${message}
                    <div class="detail-grid">
                        <div class="detail-item"><div class="d-label">Package</div><div class="d-val">${esc(o.product||'—')}</div></div>
                        <div class="detail-item"><div class="d-label">Shoot Date</div><div class="d-val">${fmtDate(o.shootDate)}</div></div>
                        <div class="detail-item"><div class="d-label">Shoot Time</div><div class="d-val">${esc(o.shootTime||'—')}</div></div>
                        <div class="detail-item"><div class="d-label">Package Details</div><div class="d-val">${esc(o.packageDetails||o.notes||'—')}</div></div>
                        <div class="detail-item"><div class="d-label">Total</div><div class="d-val">${RZA(o.total)}</div></div>
                        <div class="detail-item"><div class="d-label">Paid</div><div class="d-val" style="color:#27ae60;">${RZA(o.paid)}</div></div>
                        ${outstandingHtml}
                        <div class="detail-item"><div class="d-label">Delivery Deadline</div><div class="d-val">${fmtDate(o.deadline)}</div></div>
                    </div>

                    <div class="deliverables-section">
                        <h3>Project Status</h3>
                        ${timeline}
                    </div>

                    ${hasDocs ? `<div class="deliverables-section"><h3>Documents</h3><div class="doc-links">${contractBtn}${invoiceBtn}</div></div>` : ''}

                    <div class="deliverables-section">
                        <h3>Deliverables</h3>
                        ${deliverables}
                    </div>
                </div>
            </div>
        </div>
    </div>`;
}

/* ============================================================
   FIREBASE INIT
   ============================================================ */
const configured = true; // config is embedded directly above

function init(){
    if(!configured){
        $('loginGate').innerHTML = `<div class="login-card">
            <div class="brand">FOM STUDIOS</div>
            <div class="brand-sub" style="margin-bottom:0;">The client portal requires Firebase to be configured. Please contact FOM Studios.</div>
        </div>`;
        return;
    }

    // Firebase SDKs are loaded in <head> — initialise directly
    // Guard against double-init (throws if called twice with same app name)
    // Guard against double-init on page reload
    let app;
    try { app = initializeApp(firebaseConfig); }
    catch(e) { app = getApp(); }
    const auth = getAuth(app);
    const db   = getFirestore(app);
    

    /* --- password reset --- */
    $('resetLink').addEventListener('click', () => {
        const email = $('lgEmail').value.trim();
        if(!email){ $('lgErr').textContent = 'Enter your email address first.'; return; }
        sendPasswordResetEmail(auth, email)
            .then(()=>{ $('lgErr').style.color='#27ae60'; $('lgErr').textContent='Reset email sent — check your inbox.'; })
            .catch(err=>{ $('lgErr').style.color='#c0392b'; $('lgErr').textContent = err.message||'Could not send reset email.'; });
    });

    /* --- sign in --- */
    const login = () => {
        $('lgErr').textContent = '';
        $('lgErr').style.color = '#c0392b';
        signInWithEmailAndPassword(auth, $('lgEmail').value.trim(), $('lgPass').value)
            .catch(err => {
                $('lgErr').textContent = /password|user|credential|email/i.test(err.code||'')
                    ? 'Incorrect email or password.' : (err.message||'Sign in failed.');
            });
    };
    $('lgBtn').addEventListener('click', login);
    $('lgPass').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

    /* --- auth state --- */
    onAuthStateChanged(auth, user => {
        if(user){
            $('loginGate').style.display = 'none';
            $('mainApp').style.display = 'block';

            // personalise greeting with email name
            const name = user.displayName || user.email.split('@')[0];
            $('greetingName').textContent = 'Welcome, ' + name.charAt(0).toUpperCase() + name.slice(1);

            // listen to orders in real time, filtered client-side
            onSnapshot(collection(db, 'orders'), snap => {
                const orders = snap.docs.map(d => ({id:d.id, ...d.data()}));
                renderOrders(orders, user.email);
            }, err => console.warn('Firestore:', err));

            $('logoutBtn').addEventListener('click', () => signOut(auth));
        } else {
            $('loginGate').style.display = 'flex';
            $('mainApp').style.display = 'none';
        }
    });
}

init();

</script>
</body>
</html>
